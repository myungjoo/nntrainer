plugins {
    id 'com.android.application'
    id 'kotlin-android'
}

android {
    compileSdk 30
    buildToolsVersion "30.0.3"

    defaultConfig {
        applicationId "com.samsung.sr.nntr.nntrainer"
        minSdk 30
        targetSdk 30
        versionCode 1
        versionName "1.3.4"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        vectorDrawables {
            useSupportLibrary true
        }

        externalNativeBuild{
            ndkBuild{
	       def nntrainer

               arguments "NDK_APPLICATION_MK=src/main/jni/Application.mk"
	       targets "nntrainer_resnet"

               abiFilters 'arm64-v8a'
	    }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
    kotlinOptions {
        jvmTarget = '1.8'
        useIR = true
    }
    buildFeatures {
        compose true
    }
    composeOptions {
        kotlinCompilerExtensionVersion compose_version
    }

    externalNativeBuild {
    	ndkBuild{
	    path 'src/main/jni/Android.mk'
	}
    }

    // Explicit jniLibs source dir + disable legacy packaging. The kotlin
    // sample also uses externalNativeBuild ndkBuild for its own _jni.so,
    // but transitive dependencies (libnntrainer.so, libccapi-nntrainer.so,
    // libopenblas.so, libomp.so, ...) still need to be staged into
    // jniLibs from the top-level libs/arm64-v8a output.
    sourceSets {
        main {
            jniLibs.srcDirs = ['src/main/jniLibs']
        }
    }
    packagingOptions {
        jniLibs {
            useLegacyPackaging = false
        }
    }
}

// Pull the nntrainer .so set built by tools/package_android.sh into the
// APK's jniLibs before assembly. See ResnetJNI/app/build.gradle for the
// expected source layout.
tasks.register('copyNntrainerJniLibs', Copy) {
    def srcDir = file("${rootProject.projectDir}/../../../libs/arm64-v8a")
    onlyIf { srcDir.exists() }
    from srcDir
    into 'src/main/jniLibs/arm64-v8a'
    include '**/*.so'
}
preBuild.dependsOn 'copyNntrainerJniLibs'

dependencies {

    implementation 'androidx.core:core-ktx:1.6.0'
    implementation 'androidx.appcompat:appcompat:1.3.0'
    implementation 'com.google.android.material:material:1.4.0'
    implementation "androidx.compose.ui:ui:$compose_version"
    implementation "androidx.compose.material:material:$compose_version"
    implementation "androidx.compose.ui:ui-tooling:$compose_version"
    implementation "androidx.compose.runtime:runtime-livedata:$compose_version"
    implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.3.1'
    implementation 'androidx.activity:activity-compose:1.3.0'
    implementation 'androidx.navigation:navigation-compose:2.4.0-alpha05'
    implementation 'com.google.code.gson:gson:2.8.9'
    testImplementation 'junit:junit:4.+'
    androidTestImplementation 'androidx.test.ext:junit:1.1.3'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.4.0'
    androidTestImplementation "androidx.compose.ui:ui-test-junit4:$compose_version"
}
