plugins {
    id 'com.android.application'
}

android {
    compileSdk 31

    defaultConfig {
        applicationId "com.applications.picogptjni"
        minSdk 21
        targetSdk 31
        versionCode 1
        versionName "1.0"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
    namespace 'com.applications.picogptjni'

    // Restrict APK to arm64-v8a — that is the only ABI nntrainer is
    // built for in tools/package_android.sh.
    ndk {
        abiFilters 'arm64-v8a'
    }

    // Explicit jniLibs source dir + disable legacy packaging so .so
    // files are loaded from inside the APK instead of being extracted.
    sourceSets {
        main {
            jniLibs.srcDirs = ['src/main/jniLibs']
        }
    }
    packagingOptions {
        jniLibs {
            useLegacyPackaging = false
        }
    }
}

// Pull the nntrainer .so set built by tools/package_android.sh into the
// APK's jniLibs before assembly. See ResnetJNI/app/build.gradle for the
// expected source layout.
tasks.register('copyNntrainerJniLibs', Copy) {
    def srcDir = file("${rootProject.projectDir}/../../../libs/arm64-v8a")
    onlyIf { srcDir.exists() }
    from srcDir
    into 'src/main/jniLibs/arm64-v8a'
    include '**/*.so'
}
preBuild.dependsOn 'copyNntrainerJniLibs'

dependencies {

    implementation 'androidx.appcompat:appcompat:1.4.1'
    implementation 'com.google.android.material:material:1.5.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.3'
    testImplementation 'junit:junit:4.+'
    androidTestImplementation 'androidx.test.ext:junit:1.1.3'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.4.0'
}
